server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: pedidos360-notificaciones-service

  # Conexion al broker RabbitMQ (sobreescribible por variables de entorno)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # ACK manual: cada consumidor confirma o rechaza explicitamente cada mensaje
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false

  # Cliente Kafka (consumidor de auditoria). Deserializers definidos en KafkaAuditoriaConfig.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    client-id: pedidos360-notificaciones
    consumer:
      # Grupo PROPIO de la auditoria: recibe TODOS los eventos del topico, igual que el grupo
      # 'pedidos360-analitica', sin quitarle mensajes (publicar/suscribir entre grupos distintos).
      group-id: ${KAFKA_GROUP_ID:pedidos360-auditoria}
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read-committed
      max-poll-records: 50
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        session.timeout.ms: 45000
        heartbeat.interval.ms: 3000
    producer:
      # Solo lo usa el envio al Dead Letter Topic
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
    listener:
      missing-topics-fatal: false

app:
  # Topologia de mensajeria: UNICO lugar donde se definen nombres de exchanges, colas y routing keys.
  # Debe coincidir con app.rabbitmq del backend de pedidos.
  rabbitmq:
    exchanges:
      pedidos: pedidos360.pedidos.exchange
      dead-letter: pedidos360.dlx
    queues:
      notificaciones: pedidos360.notificaciones.queue
      tickets: pedidos360.tickets.queue
      notificaciones-dlq: pedidos360.notificaciones.dlq
      tickets-dlq: pedidos360.tickets.dlq
    routing-keys:
      notificaciones-binding: pedido.#
      tickets-binding: pedido.creado
      notificaciones-dlq: notificaciones.dlq
      tickets-dlq: tickets.dlq
    reintentos:
      # Veces que se reintenta un error recuperable antes de enviar el mensaje a la DLQ
      maximo: ${RABBITMQ_REINTENTOS_MAXIMO:3}
      header: x-reintentos
    dlq:
      # true: el microservicio consume las DLQ y registra cada mensaje muerto en el log.
      # false: los mensajes quedan almacenados en la DLQ para inspeccionarlos en la consola de RabbitMQ.
      listener-habilitado: ${DLQ_LISTENER_HABILITADO:true}

  tickets:
    directorio: ${TICKETS_DIR:tickets}

  # Auditoria de pedidos por Kafka. Convive con RabbitMQ sin tocarlo: si se desactiva,
  # notificaciones y tickets siguen funcionando igual.
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      pedidos-eventos: pedidos360.pedidos.eventos
      pedidos-eventos-dlt: pedidos360.pedidos.eventos.DLT
    consumo:
      concurrencia: ${KAFKA_CONCURRENCIA:3}
    reintentos:
      # Error transitorio (ej: no se pudo escribir el archivo): 3 reintentos 1s, 2s, 4s y luego al DLT
      maximo: ${KAFKA_REINTENTOS_MAXIMO:3}
      intervalo-inicial-ms: 1000
      multiplicador: 2.0

  auditoria:
    # Un archivo por dia con una linea por evento: auditoria/pedidos-AAAA-MM-DD.txt
    directorio: ${AUDITORIA_DIR:auditoria}
    # eventoId recordados para no registrar dos veces el mismo evento
    capacidad-idempotencia: 10000
