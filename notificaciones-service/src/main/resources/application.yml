server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: pedidos360-notificaciones-service

  # Conexion al broker RabbitMQ (sobreescribible por variables de entorno)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # ACK manual: cada consumidor confirma o rechaza explicitamente cada mensaje
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false

app:
  # Topologia de mensajeria: UNICO lugar donde se definen nombres de exchanges, colas y routing keys.
  # Debe coincidir con app.rabbitmq del backend de pedidos.
  rabbitmq:
    exchanges:
      pedidos: pedidos360.pedidos.exchange
      dead-letter: pedidos360.dlx
    queues:
      notificaciones: pedidos360.notificaciones.queue
      tickets: pedidos360.tickets.queue
      notificaciones-dlq: pedidos360.notificaciones.dlq
      tickets-dlq: pedidos360.tickets.dlq
    routing-keys:
      notificaciones-binding: pedido.#
      tickets-binding: pedido.creado
      notificaciones-dlq: notificaciones.dlq
      tickets-dlq: tickets.dlq
    reintentos:
      # Veces que se reintenta un error recuperable antes de enviar el mensaje a la DLQ
      maximo: ${RABBITMQ_REINTENTOS_MAXIMO:3}
      header: x-reintentos
    dlq:
      # true: el microservicio consume las DLQ y registra cada mensaje muerto en el log.
      # false: los mensajes quedan almacenados en la DLQ para inspeccionarlos en la consola de RabbitMQ.
      listener-habilitado: ${DLQ_LISTENER_HABILITADO:true}

  tickets:
    directorio: ${TICKETS_DIR:tickets}
