# Broker RabbitMQ para desarrollo local de Pedidos360.
#   AMQP:    localhost:5672
#   Consola: http://localhost:15672  (usuario: guest / clave: guest)
services:
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: pedidos360-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq-data:
