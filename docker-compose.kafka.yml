# =========================================================================
# Arquitectura Kafka para desarrollo local de Pedidos360 (EP5)
# =========================================================================
#   Zookeeper:          localhost:2181
#   Brokers (clientes): localhost:9092, localhost:9093, localhost:9094
#   Kafka-UI:           http://localhost:8090
#
# Tres brokers permiten usar factor de replicacion 3 con min.insync.replicas=2:
# el cluster sigue aceptando escrituras con acks=all aunque se caiga un broker.
#
# Levantar:   docker compose -f docker-compose.kafka.yml up -d
# Detener:    docker compose -f docker-compose.kafka.yml down
#
# Cada broker expone dos listeners:
#   INTERNAL (kafkaN:29092) -> trafico entre brokers y con kafka-ui / kafka-init (red de Docker)
#   EXTERNAL (localhost:909X) -> microservicios Spring Boot que corren en el host
name: pedidos360-kafka

x-kafka-comun: &kafka-comun
  image: confluentinc/cp-kafka:7.6.1
  depends_on:
    zookeeper:
      condition: service_healthy
  restart: unless-stopped

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # Los topicos internos tambien se replican en los 3 brokers
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  # Los topicos solo se crean de forma controlada (script kafka-init, KafkaAdmin o kafka-admin-service)
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DELETE_TOPIC_ENABLE: "true"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pedidos360-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode || cub zk-ready localhost:2181 5"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  kafka1:
    <<: *kafka-comun
    container_name: pedidos360-kafka1
    hostname: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092
    volumes:
      - kafka1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka1:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 15

  kafka2:
    <<: *kafka-comun
    container_name: pedidos360-kafka2
    hostname: kafka2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://localhost:9093
    volumes:
      - kafka2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka2:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 15

  kafka3:
    <<: *kafka-comun
    container_name: pedidos360-kafka3
    hostname: kafka3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://localhost:9094
    volumes:
      - kafka3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka3:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 15

  # Crea (o actualiza) los topicos del proyecto con sus particiones, replicas y configuraciones.
  # Se ejecuta una vez y termina. Es idempotente: se puede volver a correr sin efectos adversos.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pedidos360-kafka-init
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka1:29092,kafka2:29092,kafka3:29092
    volumes:
      - ./kafka:/scripts:ro
    entrypoint: ["bash", "/scripts/crear-topicos.sh"]
    restart: "no"

  # Consola web para administrar brokers, topicos, mensajes y consumer groups
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: pedidos360-kafka-ui
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:
