# Las pruebas usan una base H2 en memoria: no dependen de la base cloud ni escriben en ella.
spring.datasource.url=jdbc:h2:mem:pedidos-test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always

# Las pruebas unitarias no necesitan un cluster Kafka. PedidoKafkaIntegrationTest lo activa
# explicitamente cuando se ejecuta con KAFKA_IT=true y el cluster de docker-compose.kafka.yml arriba.
app.kafka.enabled=false
